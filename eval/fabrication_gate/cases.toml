# Fabrication-gate eval harness — frozen cases.
#
# Measures `program/integrity/gate.py` against fixed inputs. Runner:
#
#     python -m scripts.fabrication_eval [--runs N] [--case ID ...] [--json PATH]
#
# FROZEN. Once committed, a case's inputs and expected verdict are not edited to
# make the gate pass. Changing `should_flag`, `answer`, `trace`, `situation` or
# `soul` carries the same review weight as changing the gate itself, and
# `tests/test_gate_eval.py` pins a fingerprint over exactly those fields so an
# edit cannot land unnoticed. A harness edited to make a failing detector pass
# measures nothing. New cases may be added — that changes the fingerprint too,
# and is reviewed the same way.
#
# `note` and `documented` are informational and are NOT fingerprinted: `note`
# says why the expectation is what it is, `documented` records what was known
# about the case before this harness existed. Neither affects scoring.
#
# Fields, all required unless marked:
#   id            short, unique
#   claim_class   "tool_output" | "identity" — the class the case targets,
#                 matching gate.ClaimClass. Not necessarily the class of the
#                 finding that fires; the runner reports that separately.
#   sub_case      the named sub-case this belongs to (report breakdown key)
#   should_flag   true when a correct gate flags this answer
#   answer        the terminal answer text given to gate.check()
#   situation     the turn's situation block ("" for none)
#   soul          "live" — the gate's own ground-truth document, read live. The
#                 only accepted value: a second copy here could drift from it
#                 (design F2). The runner records that document's sha256 with
#                 every report. *Field name kept from revision 2, when the
#                 document was soul.md; revision 3 moved the gate onto
#                 architecture.md. Renaming the field would change every case's
#                 fingerprint for no change in what is measured.*
#   note          why (informational)
#   documented    (optional) prior evidence (informational)
#   [[case.trace]] zero or more trace entries, shaped as
#                 ToolResult.to_trace_entry() plus loop.py's `iteration`. Null
#                 fields are omitted (TOML has no null).
#
# Call ids are uuid4().hex, the shape the gate's S1 rule matches.

# ===========================================================================
