speaker_role = "assistant"
should_link = false
new_message = "You said Tuesday, but I think you meant Wednesday."
note = "CO4: the entity may not supersede a person's statement. Enforced by construction — the candidate is a user message, so nothing eligible is offered and no call is made. Here as a measured property rather than only a unit test."

[[case.candidate]]
