new_message = "A starter is just flour and water that wild yeast and bacteria have colonised, so keeping one alive is mostly about feeding it on a rhythm.\n\n**Feeding.** Discard all but about 50 g, then add 50 g of flour and 50 g of water and stir well. At room temperature that means once a day; in the fridge, once a week is enough.\n\n**Signs it is healthy.** It should roughly double within four to eight hours of a feed, smell pleasantly sour, and be full of bubbles. A grey liquid on top (hooch) just means it is hungry; pour it off or stir it in and feed it.\n\n**Before baking.** Feed it the night before so it is at its peak, bubbly and domed, when you mix the dough. A spoonful dropped in water should float."
