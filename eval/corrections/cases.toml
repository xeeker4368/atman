speaker_role = "user"
should_link = true
target = "p3"
replacement = "replaced"
new_message = "The bike lock code is 4417, not 4471 — I transposed it."
note = "Guards against position bias: the target is third of three, and two plausible-looking numeric claims sit above it."

[[case.candidate]]
id = "p1"
role = "user"
content = "The car needs its service at 40,000 miles."

[[case.candidate]]
id = "p2"
role = "user"
content = "The boiler pressure should sit around 1.4 bar."

[[case.candidate]]
id = "p3"
role = "user"
content = "The bike lock code is 4471."

