note = "CO8's second phrasing, added 2026-09-19 at review. C6 contradicts by restating the fact it denies (\"The dentist isn't Tuesday\"); this one carries no claim content at all and contradicts purely by reference. They are different problems — one can be matched on the fact named, the other cannot — and measuring the broadened definition on a single phrasing was 3.4's standing limitation. It also gives wrong_state's `contradicted` direction a second case, so that rate no longer moves in whole-case steps."
documented = "MEASURED FAILING, 2026-09-19, 0/5 then 0/20 — missed, not wrong-target. The case was authored expecting the referent to be fixed by content as well as recency (p1 is an intention about the future, which cannot sensibly be called wrong; p2 is a checkable claim) and THAT PREMISE IS REFUTED: the classifier uses neither signal. It replies `CORRECTS 1, 2 CONTRADICTED` — recognising the contradiction and labelling it correctly, then attaching the singular \"that\" to every candidate in the pool — so CO5's multi-candidate guard drops it and no link is written. The failure is referent selection, not recognition. Ordering is not the cause: it names both regardless. Left failing and left frozen; whether should_link is even the right expectation for a referential contradiction against a multi-claim pool is a CO5/CO8 boundary question for review, and editing the case to match the result is what the freeze exists to prevent. UPDATE 2026-09-28 (B11 stage 3, 20 decorrelated passes, 44 cases, fingerprint c7760e49…): NO LONGER FAILING, correct 20/20 under the prompt as shipped with the D6 bullet (a person cannot correct the system's account of itself by disagreeing). It had missed 20/20 before that bullet. The mechanism is not understood: the case has no self-description content, so the bullet's effect on it is an unexplained side effect, and the earlier account above (referent selection) has not been shown wrong, only no longer expressed. Left in the frozen set with its original expectation."

