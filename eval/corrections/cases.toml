# Correction-classifier eval harness — frozen cases.
#
#     python -m scripts.correction_eval [--runs N] [--case ID ...]
#
# FROZEN, on the same terms as the fabrication gate's set. Once committed, a
# case's inputs and expectations are not edited to make the classifier pass;
# `tests/test_correction_eval.py` pins a fingerprint over exactly those fields.
# New cases may be added — that changes the fingerprint too, and is reviewed the
# same way.
#
# **Wrong target is its own failure, not a pass.** A case that expects a link
# names which candidate should be picked. A link to the wrong prior claim is
# worse than no link at all: it makes retrieval present something the person
# never corrected as superseded.
#
# **So is the wrong label.** Since CO8 a correction may or may not carry the
# correct value, and migration 6 stores which. A case that expects a link
# therefore names both the candidate and the label; the right candidate under the
# wrong label is scored `wrong_state`, never a pass, because task 3.5 renders the
# two differently.
#
# Fields, all required unless marked:
#   id             short, unique
#   kind           correction | contradiction | elaboration | doubt | restatement
#                  | topic_change | self_correction | role_guard | ambiguous
#                  | position
#   speaker_role   "user" | "assistant" — who wrote the new message
#   speaker        (optional, default "Lyle") the household member's name, as the
#                  classifier is told it. Both users appear in the set: the same
#                  judgment under the other name is a different case, and it is
#                  fingerprinted because it is an input. Ignored for the entity.
#   should_link    true when a correct classifier writes a link
#   target         (required when should_link) the candidate id that must be picked
#   replacement    (required when should_link) "replaced" when the new message
#                  supplies the correct value, "contradicted" when it only says the
#                  earlier one is wrong (CO8). Labelling the right link the wrong
#                  way is its own failure — the harness scores it `wrong_state`.
#   new_message    the message being judged
#   note           why (informational, not fingerprinted)
#   documented     (optional) prior evidence (informational)
#   [[case.candidate]]  the prior claims offered, in order: id, role, content
#
# Q16 (one user never supersedes the other) has NO case here, and the reason is
# sharper than "it is enforced elsewhere": **the prompt has no slot for a second
# person.** `corrections._render()` labels every user-role candidate with the one
# speaker name it is given, because `candidates()` has already filtered the pool
# to a single user before rendering. A cross-user pool is therefore not
# expressible through `corrections.classify()` — the entry point this harness is
# restricted to — so there is no classifier behaviour to sample. It is proved by
# construction instead, against a real two-user store, in
# `tests/test_corrections.py::test_the_other_household_member_is_never_a_candidate`.
# A proof beats a sampled rate; what is lost is only that the number does not
# appear in this report.

# ===========================================================================
# Real corrections — a link is expected, and to the right candidate
# ===========================================================================

[[case]]
id = "C1-day-replaced"
kind = "correction"
speaker_role = "user"
should_link = true
target = "p1"
replacement = "replaced"
new_message = "Actually the dentist is Wednesday, not Tuesday."
note = "The canonical shape: a fact replaced, with the replacement stated."

[[case.candidate]]
id = "p1"
role = "user"
content = "The dentist appointment is on Tuesday at 3."

[[case.candidate]]
id = "p2"
role = "user"
content = "We need oat milk and coffee beans."

[[case]]
id = "C2-number-replaced"
kind = "correction"
speaker_role = "user"
should_link = true
target = "p2"
replacement = "replaced"
new_message = "Sorry — her train is 19:40, I misread the ticket."
note = "A number replaced, and the correction is the second candidate, not the first."

[[case.candidate]]
id = "p1"
role = "user"
content = "The dentist appointment is on Tuesday at 3."

[[case.candidate]]
id = "p2"
role = "user"
content = "Jodie's train gets in at 18:40."

[[case]]
