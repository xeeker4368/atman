kind = "ambiguous"
speaker_role = "user"
should_link = false
new_message = "Both of those were wrong."
note = "CO5: a message that plausibly corrects two candidates without saying what is true instead. No link — a wrong link is worse than none, and guessing which was meant is how one happens."

