should_link = true
target = "p1"
replacement = "replaced"
new_message = "Correction to what I said earlier: the dose is 20 grams, not 18. I had the wrong figure."
note = "Decision #21/Q17: the entity correcting its own earlier claim, which is in scope and inline per C6."

[[case.candidate]]
id = "p1"
role = "assistant"
content = "For that basket the dose is 18 grams."

[[case.candidate]]
id = "p2"
role = "assistant"
content = "Grinding finer will slow the shot down."

[[case]]
id = "C5-jodie-correction"
kind = "correction"
speaker_role = "user"
speaker = "Jodie"
should_link = true
target = "p1"
replacement = "replaced"
new_message = "I had that wrong — the class is at 7, not 6."
note = "Both users: the same replaced-fact shape under the other household member's name. Nothing in the classifier should key on who is speaking, and this is where that is measured rather than assumed."

[[case.candidate]]
id = "p1"
role = "user"
content = "My pottery class is at 6 on Thursdays."

[[case.candidate]]
id = "p2"
role = "user"
content = "The studio is on the far side of town."

[[case]]
id = "C6-contradiction-no-replacement"
kind = "contradiction"
speaker_role = "user"
should_link = true
target = "p1"
replacement = "contradicted"
new_message = "The dentist isn't Tuesday."
note = "CO8, decided 2026-09-18: a flat contradiction with no replacement value is still a correction. The record should surface 'this was contradicted' even when the correct value is unknown — under CO7 staying silent is worse, because there is no fallback fact for a reader to lean on if no link fires. Found as a diagnostic at 3.4 (linked 5/5 against the design's then-narrower definition); pinned here so it is measured going forward rather than discovered once."
documented = "Its negative boundary is N2-doubt, which must keep producing no link: asserting a claim is wrong is a correction, wondering whether it is right is not."

[[case.candidate]]
id = "p1"
role = "user"
content = "The dentist appointment is on Tuesday at 3."

[[case.candidate]]
id = "p2"
role = "user"
content = "We need oat milk and coffee beans."

[[case]]
id = "C7-referential-contradiction"
kind = "contradiction"
speaker_role = "user"
should_link = true
target = "p2"
replacement = "contradicted"
new_message = "That's not right."
note = "CO8's second phrasing, added 2026-09-19 at review. C6 contradicts by restating the fact it denies (\"The dentist isn't Tuesday\"); this one carries no claim content at all and contradicts purely by reference. They are different problems — one can be matched on the fact named, the other cannot — and measuring the broadened definition on a single phrasing was 3.4's standing limitation. It also gives wrong_state's `contradicted` direction a second case, so that rate no longer moves in whole-case steps."
documented = "MEASURED FAILING, 2026-09-19, 0/5 then 0/20 — missed, not wrong-target. The case was authored expecting the referent to be fixed by content as well as recency (p1 is an intention about the future, which cannot sensibly be called wrong; p2 is a checkable claim) and THAT PREMISE IS REFUTED: the classifier uses neither signal. It replies `CORRECTS 1, 2 CONTRADICTED` — recognising the contradiction and labelling it correctly, then attaching the singular \"that\" to every candidate in the pool — so CO5's multi-candidate guard drops it and no link is written. The failure is referent selection, not recognition. Ordering is not the cause: it names both regardless. Left failing and left frozen; whether should_link is even the right expectation for a referential contradiction against a multi-claim pool is a CO5/CO8 boundary question for review, and editing the case to match the result is what the freeze exists to prevent."

[[case.candidate]]
id = "p1"
role = "user"
content = "I'll drop the parcel at the post office tomorrow."

[[case.candidate]]
id = "p2"
role = "user"
content = "The recycling is collected on alternate Tuesdays."

