should_link = false
new_message = "Since you don't want to buy anything special, the most effective method is to use **white vinegar** or **citric acid** (if you happen to have it in your pantry for baking or preserving). If you have neither, **lemon juice** can work, though it is slightly less potent.\n\nHere is how to do it:\n\n### 1. The Vinegar Method (Most Common)\nThis is the standard way to dissolve calcium carbonate (limescale).\n\n*   **The Ratio:** Mix equal parts water and white vinegar in the kettle. If the scale buildup is very heavy, you can use a higher ratio of vinegar, but 1:1 is usually sufficient.\n*   **The Process:**\n    1.  Pour the mixture into the kettle.\n    2.  Bring the solution to a boil.\n    3.  Once it boils, turn the kettle off and let it sit for at least 30 minutes. For very thick scale, you can leave it for an hour.\n    4.  Pour the mixture out.\n*   **The Rinse:** This is the most important step to avoid a vinegar taste. Rinse the kettle with cold water, then fill it with plain water, boil it, and discard that water. Repeat the boiling/discarding process once or twice until the smell of vinegar is completely gone.\n\n### 2. The Lemon Method (If you have no vinegar)\nIf you have lemons, you can use the citric acid naturally present in the juice.\n\n*   **The Process:**\n    1.  Squeeze the juice of one or two lemons into the kettle.\n    2.  Add enough water to cover the scale buildup.\n    3.  Bring to a boil and let it sit for about 30 minutes.\n    4.  Scrub any loosened bits with a soft cloth or sponge if necessary.\n    5.  Rinse thoroughly by boiling plain water and discarding it.\n\n### A Note on Maintenance\nTo prevent having to do this frequently, try to avoid letting water sit in the kettle for days at a time. If you live in a hard-water area, the scale will return quickly. Emptying the kettle after use and letting it air dry can help slow the process down."
