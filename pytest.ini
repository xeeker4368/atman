[pytest]
markers =
    live(service): calls a real service (ollama, searxng, comfyui or internet). Skipped unless --run-live is given; nothing is probed at collection.
testpaths = tests
norecursedirs =
    .git
    .pytest_cache
    .ruff_cache
    __pycache__
    reference
    venv
    .venv
    workspace
    data
    backups
