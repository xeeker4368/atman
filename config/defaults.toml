# Checked-in baseline configuration.
#
# Precedence: this file -> config/local.toml -> ANAM_* environment variables.
#
# Scope note: these are BOOTSTRAP defaults. From Phase 1 onward the settings
# table in the working database is authoritative at runtime for any key it
# holds a row for. Keys here fall into two classes:
#
#   * bootstrap-only  — never settings-backed, because they are needed before
#                       the database can be opened (paths, ports, hosts).
#   * seed values     — the starting value for a settings-backed key that has
#                       no row yet.
#
# Everything currently in this file is bootstrap-only.

[paths]
# Relative paths resolve against the project root.
data_dir = "data"
workspace_dir = "workspace"
backup_dir = "backups"

[api]
# Loopback by default. start.sh --lan overrides the host via ANAM_API_HOST.
host = "127.0.0.1"
port = 8000

[ollama]
host = "http://localhost:11434"
timeout_seconds = 300

# Seed values for settings-backed keys. Model selection and temperature become
# admin-panel settings in Phase 9; until the settings table holds a row for one,
# these are what the system uses.
[models]
chat = "gemma4:26b"
embedding = "nomic-embed-text"

[model_options]
# Pinned deliberately. gemma4:26b reports a 262144 context window; that is the
# model's capability, not a sensible allocation on a 32GB shared-memory Mac mini.
# Verified: a real 17,626-token prompt completes at this setting, 100% GPU, with
# no measurable memory penalty over smaller values. See the task 1.2 changelog
# for the measurements behind this number.
num_ctx = 32768
temperature = 0.35
# gemma4 advertises a "thinking" capability. Off: it costs latency and tokens on
# every turn, and nothing in this build consumes a reasoning trace.
think = false

[chunking]
# Greedily pack whole turns into a chunk until adding the next would exceed
# target_chars, then seal. Turn boundaries are preserved so a chunk boundary
# never falls between a question and its answer, but size decides where it goes.
#
# 2500 is ~540 tokens at the 4.63 chars/token measured in task 1.2, and half the
# 5000-char embed ceiling — so an ordinary chunk has large headroom and
# sub-chunk splitting stays exceptional rather than routine.
target_chars = 2500
# Coherence cap: without it a long run of terse turns ("ok", "yes") packs 30+
# turns spanning many topics into one chunk, diluting the embedding. This is a
# judgment value with nothing measured behind it — see the task 1.3 design, D3.
max_turns = 8

[conversations]
# Idle-close. A conversation with no new message for its window is closed
# automatically, which triggers final chunking and sets `chunked`. Load-bearing
# for chunking: the open trailing group is deliberately never indexed, so a
# conversation that never closes leaves its last turns unretrievable from
# outside itself.
#
# Two windows, because the two cases carry different risk. Which applies is
# decided by whether the last message is from the assistant (turn complete,
# nothing in flight) or the user (a turn may be running).

# Turn complete. No correctness floor applies — closing early only fragments a
# conversation someone paused in the middle of, so this is a continuity
# judgment rather than a safety one.
idle_close_minutes = 15

# A turn may be in flight. This one is a correctness constraint: below the
# duration of a worst-case turn, the janitor closes a conversation mid-turn.
#
# Measured 2026-09-01, gemma4:26b at num_ctx=32768 on this machine:
#   cold model load            19.1 s
#   prompt eval, 30,167 tokens 132.8 s  (227.2 tok/s)
#   generation at full context 22.2 tok/s  -> ~45 s for a 1,000-token answer
#   one worst-case turn        ~197 s
# With an agent loop of L iterations the bound is L x (prompt eval + generation)
# plus tool execution; at L=5 that is ~15-16 minutes. 30 is roughly 2x that.
#
# PLACEHOLDER. The agent loop does not exist yet and has not chosen an
# iteration limit or tool timeouts. Task 2.2 owes a re-derivation — recorded in
# BUILD_PLAN.md against that task, not just here.
in_flight_grace_minutes = 30

[history]
# History windowing (decision #6). A token budget, not a message count. Nothing
# is deleted or summarised — turns outside the window just stop being resent and
# stay retrievable through memory_search.

# THE TWO CHARS-PER-TOKEN MARGINS, TOGETHER.
#
# This project has two places that convert characters to tokens without a
# tokenizer, and they point in opposite directions on purpose. BUILD_PLAN's task
# 1.10 entry asks for both to be documented in one place so they cannot drift
# apart by accident. This is that place.
#
#   1. history.chars_per_token = 4.0   (below)
#      Used as: estimated_tokens = chars / 4.0
#      Safe when the divisor is AT OR BELOW the text's true ratio, because that
#      over-counts tokens and the window under-fills.
#      Measured basis: task 1.2 saw 4.63 chars/token over 81,600 chars of real
#      prose (and the 2026-08-31 muse-glimmer eval independently saw 4.619 on
#      the same prompt — a 0.2% spread). At 4.63 actual vs 4.0 assumed the
#      estimate over-counts by ~14%. Safe direction, measured.
#
#   2. embedding.max_input_chars = 5000 against a 2048-token model context
#      Implies 2.44 chars/token.
#      Used as: a hard character ceiling on what is sent to the embedder.
#      Safe when the implied ratio is BELOW the true one, same as above.
#      At 4.63 actual this is ~47% of what would fit — very conservative.
#
# They diverge because the consequences differ. Over-running the embedder's
# 2048-token context is a hard HTTP rejection of that one call, so its margin is
# bought cheaply and set wide. Over-running num_ctx is a silent drop of the
# oldest history by the model server, so its margin is set as wide as it can be
# without wasting most of a 32K window on slack.
#
# KNOWN GAP, NOT MEASURED: symbol-dense text — code, JSON, tool traces — runs
# nearer 3 chars/token. At 3.0 actual against the 4.0 divisor the history
# estimate UNDER-counts by ~33%, which is the overflow direction. Nothing in
# this build has measured a code-heavy conversation yet. safety_margin_tokens
# below is the only thing standing between that case and a silent drop, and it
# is not sized to cover it. Re-measure once real conversations exist; if dense
# content is common here, this drops to 3.0 and costs window space rather than
# correctness.
chars_per_token = 4.0

# Per-message cost of the chat template's role markers and delimiters, on top of
# the content itself. Charged per message so a long run of short turns is not
# systematically under-priced.
#
# JUDGMENT VALUE, NOTHING MEASURED BEHIND IT. Reading it off the model's actual
# chat template would make it real; that was not done. 4 is a small round number
# in the right direction (over-charging is the safe direction here too).
message_overhead_tokens = 4

# Context space held back for the model's own reply, never given to history.
#
# JUDGMENT VALUE, NOTHING MEASURED BEHIND IT. 2048 tokens is ~92 seconds of
# generation at the 22.2 tok/s measured on this hardware at full context, which
# is a plausible ceiling for a long answer but is not a measurement of what
# answers this system actually produces — there is no chat endpoint yet to
# measure. Under-reserving here truncates the reply; over-reserving only costs
# history. Revisit once real turns exist.
output_reserve_tokens = 2048

# Unallocated slack. Absorbs estimator error on text denser than the prose the
# 4.63 figure came from.
#
# JUDGMENT VALUE, NOTHING MEASURED BEHIND IT. 512 tokens covers roughly a 2%
# under-count of a 32K window. It does NOT cover the ~33% under-count that
# fully code-dense content would produce — see the known gap above. It is slack,
# not a solution to that case.
safety_margin_tokens = 512

[embedding]
# nomic-embed-text reports embedding length 768. Asserted on every embed call —
# a silent dimension change would corrupt the vector store.
expected_dimension = 768
# The model's real context length is 2048 tokens, even though Ollama's own
# parameter block defaults num_ctx to 8192 for it. Over-length input is rejected
# by the server rather than truncated, so the application sizes its own input.
# The splitter that enforces this is task 1.3; this is the budget it works to.
max_input_chars = 5000

[app]
timezone = "America/New_York"
