# Checked-in baseline configuration.
#
# Precedence: this file -> config/local.toml -> ANAM_* environment variables.
#
# Scope note: these are BOOTSTRAP defaults. From Phase 1 onward the settings
# table in the working database is authoritative at runtime for any key it
# holds a row for. Keys here fall into two classes:
#
#   * bootstrap-only  — never settings-backed, because they are needed before
#                       the database can be opened (paths, ports, hosts).
#   * seed values     — the starting value for a settings-backed key that has
#                       no row yet.
#
# Everything currently in this file is bootstrap-only.

[paths]
# Relative paths resolve against the project root.
data_dir = "data"
workspace_dir = "workspace"
backup_dir = "backups"

[api]
# Loopback by default. start.sh --lan overrides the host via ANAM_API_HOST.
host = "127.0.0.1"
port = 8000

[ollama]
host = "http://localhost:11434"
timeout_seconds = 300

# Seed values for settings-backed keys. Model selection and temperature become
# admin-panel settings in Phase 9; until the settings table holds a row for one,
# these are what the system uses.
[models]
chat = "gemma4:26b"
embedding = "nomic-embed-text"

[model_options]
# Pinned deliberately. gemma4:26b reports a 262144 context window; that is the
# model's capability, not a sensible allocation on a 32GB shared-memory Mac mini.
# Verified: a real 17,626-token prompt completes at this setting, 100% GPU, with
# no measurable memory penalty over smaller values. See the task 1.2 changelog
# for the measurements behind this number.
num_ctx = 32768
temperature = 0.35
# gemma4 advertises a "thinking" capability. Off: it costs latency and tokens on
# every turn, and nothing in this build consumes a reasoning trace.
think = false

[chunking]
# Greedily pack whole turns into a chunk until adding the next would exceed
# target_chars, then seal. Turn boundaries are preserved so a chunk boundary
# never falls between a question and its answer, but size decides where it goes.
#
# 2500 is ~540 tokens at the 4.63 chars/token measured in task 1.2, and half the
# 5000-char embed ceiling — so an ordinary chunk has large headroom and
# sub-chunk splitting stays exceptional rather than routine.
target_chars = 2500
# Coherence cap: without it a long run of terse turns ("ok", "yes") packs 30+
# turns spanning many topics into one chunk, diluting the embedding. This is a
# judgment value with nothing measured behind it — see the task 1.3 design, D3.
max_turns = 8

[conversations]
# Idle-close. A conversation with no new message for its window is closed
# automatically, which triggers final chunking and sets `chunked`. Load-bearing
# for chunking: the open trailing group is deliberately never indexed, so a
# conversation that never closes leaves its last turns unretrievable from
# outside itself.
#
# Two windows, because the two cases carry different risk. Which applies is
# decided by whether the last message is from the assistant (turn complete,
# nothing in flight) or the user (a turn may be running).

# Turn complete. No correctness floor applies — closing early only fragments a
# conversation someone paused in the middle of, so this is a continuity
# judgment rather than a safety one.
idle_close_minutes = 15

# A turn may be in flight. This one is a correctness constraint: below the
# duration of a worst-case turn, the janitor closes a conversation mid-turn.
#
# RE-DERIVED 2026-09-08 against the agent loop that now exists (task 2.2). The
# earlier 30/20 pair was explicitly a placeholder, computed from an ASSUMED
# 5-iteration loop before one was built. These numbers replace it.
#
# Built on ENFORCED CEILINGS, not on measured timings. The floor is the value
# below which idle-close closes a conversation mid-generation, so what bounds it
# has to be what the code actually enforces — a slow-but-not-timed-out call
# still has to fit underneath. Every term below is a limit some other setting
# imposes:
#
#   persist the user message      40 s  database.write_retry_deadline_seconds
#                                       + database.busy_timeout_seconds
#   retrieval embedding          300 s  ollama.timeout_seconds
#   L model calls               1500 s  agent.max_iterations x ollama.timeout_seconds
#   fabrication gate classifier  300 s  ollama.timeout_seconds (Phase 3)
#   tool execution, aggregate    120 s  agent.tool_budget_seconds
#   persist the assistant reply   40 s  as above
#   idle sweep                     0 s  runs AFTER the response, in the background
#                              -------
#                               2300 s  = 38.3 min  -> floor 39
#
# RE-DERIVED AGAIN 2026-09-15 when the fabrication gate added a sixth model call
# to the turn (docs/FABRICATION_GATE_DESIGN.md F3). The gate is MEASURED at
# 0.45 s warm; the 300 s above is the enforced ceiling it inherits from
# ollama.timeout_seconds, not what it costs. Giving the classifier its own
# shorter timeout would bring the floor back toward 34 — flagged as a possible
# tightening, not taken here, because it is a change to a setting the gate does
# not own.
#
# The floor lives in program/config.py as IN_FLIGHT_GRACE_FLOOR_MINUTES, and
# tests/test_idle.py recomputes this arithmetic from the live config values
# rather than hard-coding 34 alone — so raising agent.max_iterations without
# raising the floor fails the suite instead of silently invalidating it.
#
# Sanity check on MEASURED rather than enforced timings (2026-09-01, gemma4:26b
# at num_ctx=32768): first call 19.1 + 132.8 + 2048/22.2 = 244.2 s, four more at
# 225.1 s, plus 120 s of tools and ~22 s of embedding and writes = ~21.4 min.
# NOTE what that says about the old value: 21.4 min was ALREADY above the
# previous 20-minute floor. The placeholder was under even on measured numbers,
# not only on ceilings.
#
# 46 is the floor plus ~18% for un-modelled overhead (HTTP, JSON, thread
# scheduling) — the same ratio the previous pair used (40/34), applied to the new
# floor. Less headroom than the original 1.5x because the floor is built from
# ceilings rather than from a measurement, so it is already pessimistic.
# JUDGMENT VALUE at that last step; the 39 underneath it is not.
in_flight_grace_minutes = 46

[agent]
# The agent loop (task 2.2): call the model, dispatch any tool calls, feed the
# results back, repeat. Everything here is BOOTSTRAP-ONLY and deliberately not
# settings-backed: conversations.in_flight_grace_minutes' floor is DERIVED from
# max_iterations and tool_budget_seconds, so a runtime edit to either could
# invalidate that floor without touching it.

# Model calls allowed in one turn. The "L" in the idle-close floor arithmetic.
#
# JUDGMENT VALUE. Derived from the deepest tool chain this build can actually
# produce rather than from a round number: memory_search -> web_search ->
# web_fetch -> answer is four model calls, and the fifth is headroom for one
# retry after a malformed call. Phase 2 registers no other model-callable tools.
#
# THE LAST ITERATION IS ALWAYS MADE WITH NO TOOLS ATTACHED. The loop cannot end
# on an unanswered tool call: iteration L is sent without a tools= payload, so
# the only thing it can return is an answer. That is why L counts model calls
# and not tool rounds - L=5 means at most 4 rounds of tools.
#
# Raising this raises the in-flight grace floor by roughly 5 minutes per
# iteration (one ollama.timeout_seconds). The two move together or the floor
# stops being a bound.
max_iterations = 5

# Total wall-clock a turn may spend WAITING on tools, summed across every call
# in every iteration.
#
# JUDGMENT VALUE, derived: (max_iterations - 1) x tools.default_timeout_seconds
# = 4 x 30. A per-tool timeout alone does not bound a turn, because one
# iteration may emit several calls; this is what makes the aggregate finite and
# therefore what the idle-close floor can be computed from. Each dispatch is
# given min(its own timeout, what remains), and calls made after the budget is
# spent are recorded as `skipped` and fed back to the model as such.
#
# CONSEQUENCE, FLAGGED: a tool needing 300s - image generation carried exactly
# that in the reference build - cannot complete inside a turn under this budget.
# That is a real constraint on Phase 4, not an oversight: either image
# generation becomes asynchronous (submit, return a handle, notify) or this
# budget rises knowingly and the grace floor rises with it.
tool_budget_seconds = 120.0

# Ceiling on one tool result's text where it re-enters the prompt.
#
# JUDGMENT VALUE. ~1000 tokens at the 4.0 chars/token in [history]. The full
# value is kept in the trace regardless - only the copy fed back to the model is
# trimmed, and the trim says so in the text rather than being silent. The
# history window is re-planned every iteration, so tool results are priced
# against the same budget as everything else; this cap stops a single large
# result from evicting the whole conversation to make room for itself.
max_tool_result_chars = 4000

[tools]
# How long a turn waits for a tool that declares no timeout of its own.
#
# JUDGMENT VALUE. 30s covers the slowest thing a Phase 2 tool does - a
# memory_search whose embedding model is cold - with margin, while being short
# enough that four of them fit the turn budget above. A tool that genuinely
# needs longer declares its own timeout_seconds; there is deliberately no way
# to declare an unbounded one.
#
# WHAT THIS BOUNDS is how long the TURN waits, not how long the tool runs.
# Python cannot safely kill a running thread, so an overrunning handler keeps
# going in a daemon thread; the outcome is recorded as `timeout`, which means
# "entered, outcome unknown, side effects possible" - deliberately distinct
# from `tool_error`, which means it ran and failed.
default_timeout_seconds = 30.0

[searxng]
# The local SearXNG instance behind the `web_search` tool (task 2.4).
#
# LOOPBACK, DELIBERATELY. This is a search proxy for the backend on this
# machine; no other device needs it. The running instance was found bound to
# 0.0.0.0 and reachable from every device on the LAN (verified with a real
# request from 192.168.0.82, not inferred from the binding) and was rebound.
# PROJECT.md's LAN-only scope is about the Anam frontend; it is not a licence
# for every service this build stands up to be LAN-reachable too.
#
# Bootstrap-only, like ollama.host: a service endpoint rather than a tuning
# value. Decision #9's Check/Verify button would apply to it once an admin panel
# exists; that is the panel task's, and is not half-built here.
url = "http://127.0.0.1:8080"

# How long one HTTP request to SearXNG may take.
#
# DERIVED from what SearXNG enforces for itself, not guessed. Its own
# `outgoing.request_timeout` is 3.0s per upstream engine and engines are queried
# in parallel, so its internal work is bounded at ~3s regardless of how many
# engines are enabled.
#
# MEASURED 2026-09-08 over five real queries against the live instance:
# 0.5s, 0.7s, 0.9s round trip, 23-27 results each.
#
# 10s is ~3x SearXNG's own internal ceiling and ~11x the measured worst case.
# The margin covers a container paging back in after idle and an engine list
# that grows over time. The TOOL's declared timeout is 15s, deliberately above
# this one, so a hung request surfaces as a specific "did not respond within
# 10s" error rather than as an uninformative tool-level timeout.
timeout_seconds = 10.0

# How many results are rendered for the model, after sorting by score here.
#
# DERIVED, and the binding constraint is context, not taste: it is the largest
# N whose WORST CASE provably fits under agent.max_tool_result_chars (4000),
# which is where the agent loop truncates a tool result.
#
# MEASURED from a real 27-result response (2026-09-08):
#   title    median  57  max 109
#   url      median  70  max 116
#   content  median 214  max 444, and EMPTY on 1 of 27
# With content rendered at most 300 chars (see web_search.py), a worst-case
# result renders in ~537 chars:
#   N=6  worst 3222 + header/notes ~430  = ~3652   fits
#   N=7  worst 3759 + header/notes ~430  = ~4189   does not
# So 6. Raw responses carry 23-27 results; rendering them all would run ~10,000
# characters and be truncated mid-result by the loop, which is a worse outcome
# than choosing the cap deliberately.
max_results = 6

[ingestion]
# File/artifact ingestion (task 2.6). Design: docs/INGESTION_DESIGN.md.
#
# TWO limits, because one number cannot bound this. MEASURED 2026-09-08, the
# text a file yields per byte differs by ~55x between formats:
#   PDF  (arXiv 1706.03762, 2.2 MB, 15 pages)  39,510 chars  = 1.8% of bytes
#   plain text                                                 ~100% of bytes
# A byte limit sized for PDFs would let a 10 MB text file produce 10 million
# characters. So bytes bound extraction cost, and characters bound indexing
# cost, which is the one that dominates.

# Largest file accepted.
#
# DERIVED from measured extraction throughput. pypdf read the 2.2 MB test PDF in
# 3.33 s = 0.66 MB/s, at a peak of 29.7 MB for a 2.2 MB file (13.5x).
#   10 MB / 0.66 MB/s  = ~15 s of extraction, the worst case
#   10 MB x 13.5       = ~135 MB peak, acceptable beside a 17 GB resident model
max_upload_bytes = 10000000

# Ceiling on extracted text, and therefore on chunks and embedding calls.
#
# DERIVED from measured embedding cost, which dominates everything else:
#   embed one 2500-char chunk        0.075 s median over 6 runs (max 0.373 cold)
#   insert one chunk row             0.0006 s  (60 inserts in 0.03 s)
# 1,000,000 chars / chunking.target_chars (2500) = 400 chunks
#   400 x 0.075 s = 30.0 s embedding
#   400 x 0.0006  =  0.2 s writing
# Worst-case whole ingestion = 15 s extraction + 30 s embedding + 0.2 s writes
#                            = ~46 s, inside a ~60 s target for a synchronous
#                              upload someone is waiting on.
#
# Over this, extraction is TRUNCATED rather than the upload refused, and
# artifacts.extraction_note records that it was — a book-length PDF should be
# partly ingested with the truncation on the record, not rejected outright.
max_extracted_chars = 1000000

[database]
# Write contention. See docs/DB_CONTENTION_DESIGN.md for the measurements.
#
# MEASURED 2026-09-01, 4 concurrent writers against a held snapshot lock:
#   lock held  2s (below busy_timeout)  ->  0 / 48 writes failed
#   lock held 11s (above busy_timeout)  ->  4 / 48 writes failed  (8%)
# The trigger is a lock held LONGER THAN busy_timeout, not writer-vs-writer
# contention, which the timeout absorbs completely. ops/backup.py creates
# exactly that shape: it holds a read transaction across both databases for the
# duration of a snapshot.

# How long one SQLite call waits for a lock before raising. It returns as soon
# as the lock frees, so this is a ceiling, not a cost paid per call.
busy_timeout_seconds = 10

# How long a write may keep STARTING new attempts after a lock failure.
#
# A deadline rather than an attempt count, so the worst case is expressible in
# seconds rather than in "however long N attempts happen to take".
#
# WORST CASE IS `write_retry_deadline_seconds + busy_timeout_seconds` = ~40s,
# not 30s: the deadline gates whether a new attempt may *start*, and an attempt
# beginning just under it can still wait a full busy_timeout. Stated plainly
# because a "30" that means 40 would be worse than useless.
#
# JUDGMENT VALUE. 30s tolerates a backup snapshot holding its lock for ~30s,
# which is far longer than the current measured hold on a small store, with room
# as the database grows. Nothing has measured how long a large-store snapshot
# actually takes.
#
# Set to 0 to disable retry entirely — which is how the reproduction test shows
# the underlying failure is still there.
write_retry_deadline_seconds = 30.0

# First backoff sleep; doubles each retry, +/-50% jitter, capped at 1s.
# JUDGMENT VALUE. Small because the common case is a lock about to free.
write_retry_base_delay_seconds = 0.05

[retrieval]
# Hybrid retrieval: BM25 + vector, fused by RRF. Design: docs/RETRIEVAL_DESIGN.md.

# RRF constant: score = sum over legs of 1/(k + rank).
#
# JUDGMENT VALUE, NOTHING MEASURED BEHIND IT — same standing as
# chunking.max_turns. 60 is the value from the original RRF paper (Cormack et
# al. 2009) and the common default. It is NOT derived from this project's data,
# and must not be read as if it were.
#
# I swept k from 0 to 200 over three real queries against the seed corpus:
# ranks 1 and 2 were IDENTICAL for every value, and only rank 3 moved. With two
# legs and 12 chunks the corpus provably cannot discriminate between values of
# k. What k controls in principle is how far a top rank in one leg outweighs
# mid-ranks in the other — small k makes rank 1 dominant, large k flattens
# toward a rank-count vote. That only becomes measurable on a corpus large
# enough for the legs to disagree.
rrf_k = 60

# How deep each leg goes before fusion. JUDGMENT VALUE.
candidates_per_leg = 50

# How many fused results come back. JUDGMENT VALUE, and it interacts with task
# 1.10's token budget — every result here is context the history window cannot
# spend on raw turns.
top_k = 10

# RELEVANCE FLOORS — DELIBERATELY UNSET. NOT "low", UNSET.
#
# BUILD_PLAN's Phase 1 note: build the floor as a configurable mechanism, leave
# actual thresholds permissive until there is real data to calibrate against.
#
# "Permissive" here means NO FLOOR IS APPLIED AT ALL, not a threshold so low it
# never fires. Those differ in a way that matters (design D4): a low-but-set
# floor is indistinguishable at the call site from a calibrated floor that
# passed, so "did the floor fire?" stops being answerable, and a future reader
# could conclude the rejection path had been exercised because a floor was
# configured and rejected nothing. Leaving them unset keeps "no floor is in
# force" an explicit, inspectable state — which is what task 1.6 reads.
#
# WHY THEY CANNOT BE SET YET, measured rather than asserted: the two existing
# off-topic datapoints DISAGREE.
#   task 1.4 reconciliation test, 6 synthetic chunks : off-topic 0.658
#   seed corpus, genuinely off-topic query           : off-topic 0.5567
# A floor of 0.6 is a reasonable reading of the first and WOULD ADMIT the
# second. Neither is a calibration; setting a number from either is a guess
# wearing the costume of a measurement.
#
# To calibrate later, uncomment and set. Note the comparison directions:
#   vector_distance_floor  cosine distance, smaller is better -> upper bound
#   lexical_score_floor    bm25() is NEGATIVE, more negative is better -> upper bound
#
# FLAGGED FOR THE LEXICAL FLOOR SPECIFICALLY: bm25() magnitude scales with the
# number of query terms (measured: the same documents roughly double from a
# one-term to a two-term query). An ABSOLUTE lexical threshold therefore means
# different things for different queries, and at calibration time this may need
# to become a RELATIVE rule — a fraction of the top score, or a gap-to-next —
# rather than the absolute comparison the mechanism ships with.
# vector_distance_floor = 0.60
# lexical_score_floor = -1.50

# Attach split siblings to a hit rather than ranking them separately (D7).
expand_siblings = true

# Cap on attached siblings per hit. JUDGMENT VALUE. It exists so a
# pathologically long split message cannot overrun the context budget task 1.10
# meters.
max_siblings_per_hit = 3

[history]
# History windowing (decision #6). A token budget, not a message count. Nothing
# is deleted or summarised — turns outside the window just stop being resent and
# stay retrievable through memory_search.

# THE TWO CHARS-PER-TOKEN MARGINS, TOGETHER.
#
# This project has two places that convert characters to tokens without a
# tokenizer, and they point in opposite directions on purpose. BUILD_PLAN's task
# 1.10 entry asks for both to be documented in one place so they cannot drift
# apart by accident. This is that place.
#
#   1. history.chars_per_token = 4.0   (below)
#      Used as: estimated_tokens = chars / 4.0
#      Safe when the divisor is AT OR BELOW the text's true ratio, because that
#      over-counts tokens and the window under-fills.
#      Measured basis: task 1.2 saw 4.63 chars/token over 81,600 chars of real
#      prose (and the 2026-08-31 muse-glimmer eval independently saw 4.619 on
#      the same prompt — a 0.2% spread). At 4.63 actual vs 4.0 assumed the
#      estimate over-counts by ~14%. Safe direction, measured.
#
#   2. embedding.max_input_chars = 5000 against a 2048-token model context
#      Implies 2.44 chars/token.
#      Used as: a hard character ceiling on what is sent to the embedder.
#      Safe when the implied ratio is BELOW the true one, same as above.
#      At 4.63 actual this is ~47% of what would fit — very conservative.
#
# They diverge because the consequences differ. Over-running the embedder's
# 2048-token context is a hard HTTP rejection of that one call, so its margin is
# bought cheaply and set wide. Over-running num_ctx is a silent drop of the
# oldest history by the model server, so its margin is set as wide as it can be
# without wasting most of a 32K window on slack.
#
# KNOWN GAP, NOT MEASURED: symbol-dense text — code, JSON, tool traces — runs
# nearer 3 chars/token. At 3.0 actual against the 4.0 divisor the history
# estimate UNDER-counts by ~33%, which is the overflow direction. Nothing in
# this build has measured a code-heavy conversation yet. safety_margin_tokens
# below is the only thing standing between that case and a silent drop, and it
# is not sized to cover it. Re-measure once real conversations exist; if dense
# content is common here, this drops to 3.0 and costs window space rather than
# correctness.
chars_per_token = 4.0

# Per-message cost of the chat template's role markers and delimiters, on top of
# the content itself. Charged per message so a long run of short turns is not
# systematically under-priced.
#
# JUDGMENT VALUE, NOTHING MEASURED BEHIND IT. Reading it off the model's actual
# chat template would make it real; that was not done. 4 is a small round number
# in the right direction (over-charging is the safe direction here too).
message_overhead_tokens = 4

# Context space held back for the model's own reply, never given to history.
#
# JUDGMENT VALUE, NOTHING MEASURED BEHIND IT. 2048 tokens is ~92 seconds of
# generation at the 22.2 tok/s measured on this hardware at full context, which
# is a plausible ceiling for a long answer but is not a measurement of what
# answers this system actually produces — there is no chat endpoint yet to
# measure. Under-reserving here truncates the reply; over-reserving only costs
# history. Revisit once real turns exist.
output_reserve_tokens = 2048

# Unallocated slack. Absorbs estimator error on text denser than the prose the
# 4.63 figure came from.
#
# JUDGMENT VALUE, NOTHING MEASURED BEHIND IT. 512 tokens covers roughly a 2%
# under-count of a 32K window. It does NOT cover the ~33% under-count that
# fully code-dense content would produce — see the known gap above. It is slack,
# not a solution to that case.
safety_margin_tokens = 512

[embedding]
# nomic-embed-text reports embedding length 768. Asserted on every embed call —
# a silent dimension change would corrupt the vector store.
expected_dimension = 768
# The model's real context length is 2048 tokens, even though Ollama's own
# parameter block defaults num_ctx to 8192 for it. Over-length input is rejected
# by the server rather than truncated, so the application sizes its own input.
# The splitter that enforces this is task 1.3; this is the budget it works to.
max_input_chars = 5000

[app]
timezone = "America/New_York"

[auth]
# Chat-endpoint authentication. Design: docs/AUTH_DESIGN.md, A1-A11.
#
# THE SIGNING SECRET IS NOT HERE, AND MUST NOT BE ADDED HERE.
# `auth.session_secret` is bootstrap-only and has no default: it belongs in
# config/local.toml (gitignored) or ANAM_AUTH_SESSION_SECRET. A default in this
# checked-in file would be a signing key every copy of this repo shares, which
# is worse than none. An absent secret raises ConfigError and the server
# refuses to start — deliberately, because serving chat unauthenticated
# because a key was missing is the failure this whole mechanism prevents.
#
#   python -c "import secrets; print(secrets.token_urlsafe(32))"

# How long a session token stays valid, from issue. ABSOLUTE, not sliding: a
# sliding window renews on every request, so a stolen token would stay valid
# indefinitely as long as it was used.
#
# JUDGMENT VALUE, NOTHING MEASURED IT — same standing as chunking.max_turns.
# 30 days is a guess about household friction: long enough that nobody types a
# password on a phone weekly, short enough that a lost device's access expires
# on its own without anyone remembering to act.
session_lifetime_days = 30

# scrypt cost. MEASURED on this machine (Mac mini, Python 3.14.5, r=8 p=1):
#   n = 2**14 (16384)  ->  27.4 ms
#   n = 2**15 (32768)  ->  47.2 ms
#   n = 2**16 (65536)  ->  92.4 ms
# 65536 is chosen for ~92 ms, paid once per login rather than per request.
#
# GOTCHA, found by running it: Python's default maxmem is too small for
# n >= 2**15 — hashlib.scrypt raises "memory limit exceeded" at 2**15 and
# 2**16 while 2**14 succeeds. program/auth.py passes maxmem explicitly.
# Memory used is roughly 128 * n * r, about 67 MB at these values.
#
# Changing these does NOT invalidate existing passwords: a stored hash carries
# the parameters it was written with, and these apply to the next hash written.
scrypt_n = 65536
scrypt_r = 8
scrypt_p = 1

# Failed logins tolerated per NAME per rolling minute. In-process: it resets on
# restart and does not exist across processes, and it cannot slow an attacker
# spreading guesses across names. JUDGMENT VALUE.
login_max_attempts_per_minute = 5
